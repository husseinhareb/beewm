# Example configuration for xdg-desktop-portal-wlr (xdpw), the ScreenCast
# backend beewm routes to.
#
# Install to:
#   ~/.config/xdg-desktop-portal-wlr/config
# (xdpw also reads ~/.config/xdg-desktop-portal-wlr/<XDG_CURRENT_DESKTOP> first,
#  i.e. ~/.config/xdg-desktop-portal-wlr/beewm — either path works.)
#
# `chooser_type` controls how the monitor/output to share is selected when an
# app starts a screencast:
#   none    - pick the only/first output automatically (good for a single monitor)
#   simple  - read the output name from the chooser's stdout
#   dmenu   - pipe the output list to a dmenu-like chooser and read the choice
#
# For a multi-monitor setup, use a picker such as `slurp` (region) or a small
# script that prints an output name. Example using slurp to pick by region:
#
#   chooser_type=dmenu
#   chooser_cmd=slurp -f %o -or
#
# Single-monitor default:

[screencast]
chooser_type=none
max_fps=60
