# xdg-desktop-portal backend routing for the beewm desktop.
#
# xdg-desktop-portal picks this file by matching the desktop name in
# $XDG_CURRENT_DESKTOP (beewm sets it to "beewm") against the file name
# "<desktop>-portals.conf". It then routes each portal interface to the
# `org.freedesktop.impl.portal.*` backend named here.
#
# beewm itself implements the wlroots screen-capture protocol
# (zwlr_screencopy_manager_v1) plus xdg-output, which is exactly what
# xdg-desktop-portal-wlr consumes. So ScreenCast (and RemoteDesktop) are routed
# to the `wlr` backend; everything else falls back to `gtk`.
#
# Install to one of:
#   /usr/share/xdg-desktop-portal/beewm-portals.conf      (system)
#   ~/.config/xdg-desktop-portal/beewm-portals.conf       (per-user, takes precedence)
#
# Requires the packages:
#   xdg-desktop-portal
#   xdg-desktop-portal-wlr   (provides the ScreenCast/RemoteDesktop impl)
#   xdg-desktop-portal-gtk   (provides the `default` fallbacks; swap for another
#                             backend you have, e.g. `kde`, if you prefer)

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.RemoteDesktop=wlr
